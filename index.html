<style>
:root{
  --bg:#050d19;

  --muted:#aac0d4;
  --teal:#40f0d3;

}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  color:var(--text);

}
.app{
  max-width:980px;

  min-height:100dvh;
  padding:16px 16px 110px;

}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 14px;font-weight:800;font-size:19px;opacity:.95}

.topicons .battery{border:2px solid #fff;border-radius:8px;padding:0 7px 1px;font-weight:900}
.brand{
  position:relative;

  padding:22px 20px 20px;

}
.brand:before,.brand:after{
  content:"";position:absolute;top:20px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.9) 0 8%, rgba(130,213,255,.35) 10% 22%, transparent 25%);
  filter:blur(.2px);opacity:.8
}
.brand:before{left:-18px}.brand:after{right:-18px}
.headerline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:2}
.logoblock{display:flex;gap:12px;align-items:flex-start}
.ball{font-size:30px;filter:drop-shadow(0 0 10px rgba(64,240,211,.5))}
.titlewrap{line-height:.92}
.kicker{font-size:15px;letter-spacing:.4em;color:#8cc8d4;text-transform:uppercase;margin-left:3px;margin-top:8px}

.title2{font-size:clamp(34px,8vw,76px);font-weight:1000;letter-spacing:-.08em;color:var(--teal);font-style:italic;text-shadow:0 0 28px rgba(64,240,211,.3), 0 6px 18px rgba(0,0,0,.35);margin-left:34px;margin-top:-4px}
.livepill,.weekpill,.redpill,.tagpill{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:18px;border:1px solid rgba(255,110,110,.65);background:rgba(74,10,17,.55);font-weight:900}
.livepill .dot,.tagpill .dot{width:10px;height:10px;border-radius:50%;background:#ff6f6f;box-shadow:0 0 12px rgba(255,111,111,.9)}
.sidepills{display:flex;flex-direction:column;gap:14px;align-items:flex-end}
.weekpill{border-color:#375c78;background:#0e2641;color:#eaf7ff}

.teammeta{line-height:1}
.teamabbr{font-size:62px;font-weight:1000;letter-spacing:-.07em;line-height:.9}

.teamrec{margin-top:4px;font-size:15px;color:#7ea8c4;font-weight:800}
.midscore{text-align:center;min-width:145px}

.posarrow{color:var(--gold);font-size:22px;font-weight:1000}

.field{

.field .endzone.left{left:0;background:linear-gradient(180deg,#5f3ba6,#3b2469);color:#c8b8ff}
.field .endzone.right{right:0;background:linear-gradient(180deg,#954e25,#6f3617);color:#ffc1a1}

.infostrip{display:grid;grid-template-columns:1.4fr 1fr 1.3fr;gap:0;padding:14px 18px;font-size:clamp(14px,2.8vw,18px);border-top:1px solid rgba(44,94,115,.75);border-bottom:1px solid rgba(44,94,115,.75)}
.infostrip div{padding-right:12px;font-weight:900}
.infostrip div+div{border-left:1px solid rgba(44,94,115,.75);padding-left:14px}
.infostrip .muted{color:#87b0c9;font-weight:800}
.impactcard{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:16px 18px 18px}
.playerpanel{min-height:150px;border-radius:16px;border:1px solid rgba(124,67,255,.55);background:radial-gradient(circle at 20% 20%, rgba(121,68,255,.55), rgba(28,16,54,.95));display:grid;place-items:center;font-size:80px;box-shadow: inset 0 0 80px rgba(255,255,255,.05)}
.impactbody{border:1px solid rgba(59,104,132,.8);border-radius:18px;padding:16px 18px;background:linear-gradient(180deg, rgba(12,25,44,.7), rgba(9,19,35,.8))}
.impacttitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:1000;margin-bottom:10px}
.tagpill{padding:8px 12px;border-radius:12px;border-color:rgba(145,92,255,.7);background:rgba(77,43,133,.45);color:#ebdaff}
.slashes{letter-spacing:.2em;color:#6e50ff;font-size:18px}
.bigimpact{font-size:clamp(24px,4.5vw,42px);font-weight:1000;letter-spacing:-.05em;line-height:1.05}
.subimpact{font-size:clamp(15px,2.9vw,20px);margin-top:8px;color:#b7d0de}
.subimpact .green{color:var(--green);font-weight:1000}
.swing{font-size:clamp(15px,2.9vw,20px);margin-top:8px;color:#bfd7e1}.swing .green{color:var(--green);font-weight:1000}
.gameshead{display:flex;justify-content:space-between;align-items:center;padding:0 2px 8px}
.gameshead h3{margin:0;font-size:18px;letter-spacing:.35em;text-transform:uppercase;color:#cbe7ff}
.filterpill{padding:12px 16px;border:1px solid #375d79;background:#0e2641;border-radius:16px;color:#eaf7ff;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gamecard{border:1px solid rgba(47,88,118,.75);background:linear-gradient(180deg, rgba(10,26,44,.92), rgba(9,20,36,.92));border-radius:20px;padding:14px 14px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer}
.gamecard.live:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#ff5e6c,#f88f58 60%, transparent)}
.gamecard.active{box-shadow:0 0 0 1px rgba(255,94,108,.55), 0 10px 30px rgba(0,0,0,.35)}
.gamecard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:1000;text-transform:uppercase;letter-spacing:.08em;color:#d9e9f7}
.livebadge{display:inline-flex;align-items:center;gap:7px;color:#ff828e}.livebadge .dot{width:10px;height:10px;border-radius:50%;background:#ff5d6c;box-shadow:0 0 10px rgba(255,93,108,.8)}
.rzbadge{padding:4px 8px;border-radius:12px;border:1px solid rgba(255,105,105,.75);background:rgba(113,20,28,.65);color:#ffd2d7}
.teamrow{display:grid;grid-template-columns:40px 1fr auto 40px;align-items:center;gap:10px;margin-top:10px}
.teamrow .tinylogo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:1000;font-size:13px;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 0 18px rgba(255,255,255,.05)}
.tinylogo span{font-size:11px}
.teamrow .name{font-size:16px;font-weight:900}
.teamrow .pts{font-size:28px;font-weight:1000;letter-spacing:-.04em}
.gamedrive{margin-top:10px;padding-top:10px;border-top:1px solid rgba(42,75,98,.8);color:#c4d9e8;font-size:17px}
.gamedrive .small{display:block;color:#9cc7dc;font-size:14px;margin-top:2px}
.matchup{margin-top:18px;border:1px solid rgba(47,88,118,.75);border-radius:24px;background:linear-gradient(180deg, rgba(7,38,47,.95), rgba(8,23,38,.95));box-shadow:var(--shadow);overflow:hidden}
.matchhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px;font-size:14px;font-weight:1000;text-transform:uppercase;letter-spacing:.18em;color:#85f7d3}
.matchbody{display:grid;grid-template-columns:1.2fr auto 1.2fr .9fr;gap:12px;align-items:center;padding:8px 18px 18px}
.avatar{display:flex;align-items:center;gap:12px}.avatar .icon{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:33px;background:radial-gradient(circle at 30% 30%, rgba(84,255,221,.35), rgba(10,42,55,.95));border:1px solid rgba(84,255,221,.55);box-shadow:inset 0 0 30px rgba(255,255,255,.06)}
.avatar.cheese .icon{background:radial-gradient(circle at 30% 30%, rgba(255,224,104,.4), rgba(55,43,8,.95));border-color:rgba(255,224,104,.55)}
.avatar .label{font-size:16px;font-weight:900;color:#ebf6ff}
.avatar .score{font-size:54px;font-weight:1000;letter-spacing:-.06em;line-height:.95}
.avatar .delta{font-size:18px;font-weight:1000;color:var(--green)}
.vs{font-size:34px;font-weight:1000;color:#b0cbdb}
.liveimpact{padding-left:16px;border-left:1px solid rgba(49,92,110,.8)}
.liveimpact h4{margin:0 0 8px;font-size:16px;letter-spacing:.18em;color:#80ffdc;text-transform:uppercase}
.liveimpact ul{margin:0;padding-left:18px;color:#d9f2ff;font-size:15px;line-height:1.5}.liveimpact .green{color:var(--green);font-weight:1000}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(980px,100%);padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg, rgba(3,11,20,.25), rgba(3,11,20,.92) 18%, rgba(3,11,20,.96));backdrop-filter:blur(14px);border-top:1px solid rgba(55,96,122,.75);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;z-index:20}
.navbtn{display:grid;place-items:center;gap:4px;padding:10px 6px 8px;border-radius:18px;color:#a8c3d6;font-weight:900;font-size:12px;text-align:center;border:1px solid transparent}
.navbtn .ico{font-size:24px}
.navbtn.active{background:linear-gradient(180deg, rgba(30,115,101,.6), rgba(9,62,72,.7));color:#edfff7;border-color:rgba(78,224,198,.45);box-shadow:inset 0 0 0 1px rgba(64,240,211,.15)}
.homebar{height:5px;width:134px;border-radius:999px;background:#fff;opacity:.85;margin:14px auto 0}
.smallnote{margin-top:12px;font-size:12px;color:#86a8bf;text-align:center}
@media (max-width:760px){
  .app{padding:12px 12px 108px}
  .topbar{font-size:16px;margin-bottom:12px}
  .headerline{align-items:flex-start}
  .sidepills{gap:10px}
  .scoreband{grid-template-columns:1fr;gap:10px}
  .midscore{order:-1}
  .teamstack,.teamstack.right{grid-template-columns:58px 1fr auto}
  .logo{width:58px;height:58px;border-radius:16px;font-size:22px}
  .teamabbr{font-size:48px}.teamshort{font-size:18px}
  .midscore .period{font-size:20px}.midscore .clock{font-size:44px}
  .field{height:145px}
  .field .endzone{font-size:22px}
  .infostrip{grid-template-columns:1fr;gap:8px;font-size:16px}.infostrip div+div{border-left:none;padding-left:0}
  .impactcard{grid-template-columns:1fr}.playerpanel{min-height:110px;font-size:68px}
  .grid{grid-template-columns:1fr}
  .matchbody{grid-template-columns:1fr;gap:14px}.vs{display:none}.liveimpact{padding-left:0;border-left:none;border-top:1px solid rgba(49,92,110,.8);padding-top:12px}
  .avatar .score{font-size:46px}
}
</style>
</head>

const games = [

        <div class="ball" style="left:${g.ballPct}%"></div>
        <div class="yards">
          <span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>40</span><span>30</span><span>20</span><span>10</span><span></span>
        </div>
      </div>
    </div>
    <div class="infostrip">
      <div>${g.down}</div>
      <div><span class="muted">${g.ball}</span></div>
      <div><span class="muted">${g.drive}</span></div>
    </div>
    <div class="impactcard">
      <div class="playerpanel">4</div>
      <div class="impactbody">
        <div class="impacttitle"><span class="tagpill">TOUCHDOWN PENDING</span><span class="slashes">////</span></div>
        <div class="bigimpact">${g.last}</div>
        <div class="subimpact">Impact: ${g.impactMatchup} <span class="green">${g.pending}</span> Sleeper</div>
        <div class="swing">Win probability swing: 74% <span class="green">→ 81%</span></div>
      </div>
    </div>`;
}
function renderGrid(){
  const grid=document.getElementById('gamesGrid');
  grid.innerHTML = games.map(g=>`<div class="gamecard live ${g.redzone?'active':''} ${selected===g.id?'active':''}" data-id="${g.id}">
    <div class="meta">
      <span class="livebadge"><span class="dot"></span>LIVE</span>
      <span>${g.period}</span>
      <span>${g.clock}</span>
      ${g.redzone?'<span class="rzbadge">RZ</span>':''}
    </div>
    <div class="teamrow">
      <div class="tinylogo ${g.away.color}"><span>${g.away.abbr}</span></div>
      <div class="name">${g.away.abbr}</div>
      <div class="pts">${g.away.score}</div>
      <div></div>
    </div>
    <div class="teamrow" style="margin-top:8px">
      <div class="tinylogo ${g.home.color}"><span>${g.home.abbr}</span></div>
      <div class="name">${g.home.abbr}</div>
      <div class="pts">${g.home.score}</div>
      <div></div>
    </div>
    <div class="gamedrive">${g.driveShort}<span class="small">›</span></div>
  </div>`).join('');
  grid.querySelectorAll('.gamecard').forEach(card=>card.addEventListener('click',()=>{selected=card.dataset.id; renderFeatured(); renderGrid();}));
}
function renderImpact(){
  const g = gameById(selected);
  document.getElementById('impactPanel').innerHTML = `
    <div class="matchhead"><div>🔥 Most affected matchup</div><div>Live impact</div></div>
    <div class="matchbody">
      <div class="avatar">
        <div class="icon">😎</div>
        <div>
          <div class="label">${g.impactMatchup}</div>
          <div class="score">${g.impactScore}</div>
          <div class="delta">▲ ${g.impactDelta}</div>
        </div>
      </div>
      <div class="vs">VS</div>
      <div class="avatar cheese">
        <div class="icon">🧀</div>
        <div>
          <div class="label">${g.impactOpp}</div>
          <div class="score">${g.oppScore}</div>
        </div>
      </div>
      <div class="liveimpact">
        <h4>Live impact</h4>
        <ul>
          <li>${g.players[0]}</li>
          <li class="green">${g.pending}</li>
          <li>Win %: 74% → <span class="green">81%</span></li>
        </ul>
      </div>
    </div>`;
}
renderFeatured(); renderGrid(); renderImpact();
</script>
</body>
</html>
